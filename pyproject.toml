[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "pybind11>=2.11.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "deme"
dynamic = ["version"]
description = "Python bindings for DEM-Engine - a GPU-accelerated Discrete Element Method simulation engine"
readme = "README.md"
authors = [
    { name = "Ruochun Zhang", email = "ruochunz@gmail.com" },
]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.19.0",
]

[project.optional-dependencies]
# Keep runtime headers, compiler headers, and NVRTC on the wheel build's CUDA minor version.
cuda12 = [
    "nvidia-cuda-runtime-cu12>=12.8,<12.9",
    "nvidia-cuda-nvrtc-cu12>=12.8,<12.9",
    "nvidia-cuda-nvcc-cu12>=12.8,<12.9",
    "nvidia-cuda-cccl-cu12>=12.8,<12.9",
    "nvidia-curand-cu12>=10.3.9,<10.3.10",
]
dev = [
    "pytest>=6.0",
    "pybind11>=2.11.0",
]

[project.urls]
Homepage = "https://github.com/projectchrono/DEM-Engine"
Repository = "https://github.com/projectchrono/DEM-Engine"
Documentation = "https://github.com/projectchrono/DEM-Engine"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.verbose = true
minimum-version = "0.8"
build-dir = "build/{wheel_tag}"

# Read the distribution version from the same source used by standalone CMake.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '''^(?P<value>\d+\.\d+\.\d+)\s*$'''

[tool.scikit-build.cmake.define]
DEME_BUILD_PYTHON = "ON"
DEME_BUILD_VISUALIZER = "ON"
# Demos and modular tests are useful in developer builds but are not wheel content.
DEME_BUILD_DEMOS = "OFF"

[tool.cibuildwheel]
# DEME contains a CPython extension, so every supported interpreter needs its own wheel.
build = "cp3{9,10,11,12,13,14}-manylinux_x86_64"
skip = "*-musllinux_*"
build-verbosity = 1

[tool.cibuildwheel.linux]
# Build on glibc 2.28 with CUDA 12.8. The cuda12 extra supplies runtime compilation dependencies.
# Keep NVIDIA components external to this wheel; never bundle the build-time driver stub.
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64:latest"
# Install the matching toolkit explicitly; the prebuilt CUDA images start at 12.9.
before-all = "bash {project}/python/scripts/install_cuda128.sh"
# CUDA RPMs place CUB package metadata under the target prefix, not necessarily the lib64 alias.
environment = { CMAKE_PREFIX_PATH = "/usr/local/cuda-12.8/targets/x86_64-linux:$CMAKE_PREFIX_PATH", CUDACXX = "/usr/local/cuda-12.8/bin/nvcc", CUDAToolkit_ROOT = "/usr/local/cuda-12.8", CUDA_HOME = "/usr/local/cuda-12.8", LD_LIBRARY_PATH = "/usr/local/cuda-12.8/lib64:$LD_LIBRARY_PATH" }
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_x86_64 --exclude libcuda.so.1 --exclude libcudart.so.12 --exclude libnvrtc.so.12 -w {dest_dir} {wheel}"
